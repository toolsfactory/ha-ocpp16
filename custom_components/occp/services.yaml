set_power_limit:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: occp
    limit_w:
      required: true
      selector:
        number:
          min: 0.01
          unit_of_measurement: "W"
          mode: box
    phases:
      required: false
      selector:
        select:
          options: ["1", "2", "3"]

clear_power_limit:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: occp

authorize_id_token:
  fields:
    charge_point_id:
      required: true
      selector:
        text:
    id_token:
      required: true
      selector:
        text:
